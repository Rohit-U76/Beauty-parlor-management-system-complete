server.port=${PORT:3000}
server.address=0.0.0.0
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Local JSON snapshot & static paths (shared with project root)
salon.db.file=${SALON_DB_FILE:../data/db.json}
salon.uploads.dir=${SALON_UPLOADS_DIR:../public/uploads}
salon.frontend.dist=${SALON_FRONTEND_DIST:../dist}
salon.app.url=${APP_URL:http://localhost:3000}
salon.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Optional MySQL relational sync (mirrors src/db/mysql.ts)
salon.mysql.enabled=${USE_MYSQL:false}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_salon_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Exclude auto datasource failure when MySQL is disabled/offline
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Integrations (via environment variables)
salon.gemini.api-key=${GEMINI_API_KEY:}
salon.bank.webhook-secret=${BANK_WEBHOOK_SECRET:modern_salon_sms_secret_token_99}
salon.razorpay.key-id=${RAZORPAY_KEY_ID:}
salon.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
